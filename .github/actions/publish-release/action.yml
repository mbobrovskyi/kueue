name: Publish Release
description: Publishes a GitHub draft release.

inputs:
  version:
    description: Release version tag (e.g. v0.10.0)
    required: true
  release-state:
    description: Current state of the release — "draft", "published", or "" (not found). Use the get-release-state action to obtain this value.
    required: true
  issue-number:
    description: GitHub issue number used for posting status comments
    required: true
  repo:
    description: Target repository in owner/name format
    required: false
    default: ${{ github.repository }}
  github-token:
    description: GitHub token with contents:write and issues:write permissions
    required: true

runs:
  using: composite
  steps:
    - name: Publish Release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.version }}
        RELEASE_STATE: ${{ inputs.release-state }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        TARGET_REPO: ${{ inputs.repo }}
      run: |
        if [ "$RELEASE_STATE" = "published" ]; then
          BODY="❌️ Release \`$VERSION\` is already published."
          echo "$BODY"
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          exit 1
        elif [ -z "$RELEASE_STATE" ]; then
          BODY="❌ Release \`$VERSION\` not found. Please create a draft release first using \`/create-draft-release\`."
          echo "$BODY"
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          exit 1
        fi

        # Publish the draft release.
        set +e
        gh release edit "$VERSION" \
          --repo "$TARGET_REPO" \
          --draft=false 2> err.log
        EDIT_EXIT=$?
        set -e

        if [ $EDIT_EXIT -ne 0 ]; then
          ERR_MSG="$(cat err.log)"
          echo "$ERR_MSG"
          gh issue comment "$ISSUE_NUMBER" --body "❌ Failed to publish release \`$VERSION\`.

          **Error details:**
          \`\`\`text
          ${ERR_MSG}
          \`\`\`"
          exit 1
        fi
